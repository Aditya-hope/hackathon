name: E2E Tests (Playwright)

on:
  push:
    branches: ["main"]
    paths:
      - "InvoicePilot_AI_Stabilized_v4/Agentic_Ai/frontend/**"
      - ".github/workflows/e2e-tests.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "InvoicePilot_AI_Stabilized_v4/Agentic_Ai/frontend/**"
      - ".github/workflows/e2e-tests.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: InvoicePilot_AI_Stabilized_v4/Agentic_Ai/frontend

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: InvoicePilot_AI_Stabilized_v4/Agentic_Ai/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the app
        run: npm run build

      # These tests never touch the live deployed backend - see the
      # comment in playwright.config.ts and e2e/fixtures.ts. They
      # exercise the app's own offline/demo mode, so no secrets or
      # network access are needed here.
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: InvoicePilot_AI_Stabilized_v4/Agentic_Ai/frontend/playwright-report/
          retention-days: 14
